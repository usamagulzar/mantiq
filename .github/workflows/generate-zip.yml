name: Generate Auto-Updater ZIP

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'update.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate update.zip
        run: node build.js
        
      - name: Commit update.zip
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate update.zip for OTA [skip ci]"
          file_pattern: 'update.zip'
